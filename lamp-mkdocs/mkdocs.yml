site_name: lamp — Documentation
site_url: https://hykrow.github.io/docs/lamp/
site_author: Noam Fauverte
site_dir: ../docs/lamp

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    primary: white
    accent: indigo
  font:
    text: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif
    code: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences 
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Maths: maths.md
  - Architecture: architecture.md
  - API: api.md
  - Tutoriels: tutorials.md
  - Benchmarks: benchmarks.md
  - Roadmap: roadmap.md