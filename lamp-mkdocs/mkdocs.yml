site_name: lamp — Documentation
site_url: https://hykrow.github.io/docs/lamp/
site_author: Noam Fauverte
site_dir: ../docs/lamp

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - content.code.copy
  # Thème uniquement sombre (comme ton site)
  palette:
    - scheme: slate
      primary: custom
      accent: custom
  font:
    text: false
    code: false
  icon:
    logo: material/chevron-left
    repo: fontawesome/brands/github

plugins:
  - search

extra_css:
  - stylesheets/brand.css
  - stylesheets/extra.css
  - stylesheets/header-mirror.css

## client-side header fetch no longer needed (we include server-side partial)
# extra_javascript:
#  - javascripts/header-mirror.js

nav:
  - "← Retour au site": /
  - Home: index.md
  - Blog:
      - blog/index.md
  - Quickstart: quickstart.md
  - Maths: maths.md
  - Architecture: architecture.md
  - API: api.md
  - Tutoriels: tutorials.md
  - Benchmarks: benchmarks.md
  - Roadmap: roadmap.md
  