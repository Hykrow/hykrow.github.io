site_name: lamp — Documentation
site_url: https://hykrow.github.io/docs/lamp/
site_author: Noam Fauverte
site_dir: ../docs/lamp

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
  font: false

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences 
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Maths: maths.md
  - Architecture: architecture.md
  - API: api.md
  - Tutoriels: tutorials.md
  - Benchmarks: benchmarks.md
  - Roadmap: roadmap.md