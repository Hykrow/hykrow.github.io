site_name: lamp — Documentation
site_url: https://hykrow.github.io/docs/lamp/
site_author: Noam Fauverte
site_dir: ../docs/lamp

theme:
  name: material
  custom_dir: overrides          # <-- on active nos overrides
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.indexes         # pages d’index de section (utile pour "Blog")
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom            # nous allons mapper vers tes couleurs
      accent: custom
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
  font:
    text: false                  # pas de Google Fonts; on met nos fontes via CSS
    code: false
  icon:
    logo: material/chevron-left
    repo: fontawesome/brands/github

plugins:
  - search

extra_css:
  - stylesheets/brand.css        # couleurs + polices venant de ton site
  - stylesheets/extra.css        # resets + confort de lecture

nav:
  - "← Retour au site": /
  - Home: index.md
  - Blog:
      - blog/index.md
  - Quickstart: quickstart.md
  - Maths: maths.md
  - Architecture: architecture.md
  - API: api.md
  - Tutoriels: tutorials.md
  - Benchmarks: benchmarks.md
  - Roadmap: roadmap.md
